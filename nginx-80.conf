# فقط پورت 80 — پورت 443 برای تانل/REALITY آزاد بماند
# catch-all: هر Host (IP یا دامنه) را قبول می‌کند
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;
    underscores_in_headers on;

    if ($request_method !~ ^(GET|HEAD|POST)$) {
        return 405;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # فایل‌های حساس را سرو نکن
    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/camouflage.access.log;
    error_log  /var/log/nginx/camouflage.error.log warn;
}
