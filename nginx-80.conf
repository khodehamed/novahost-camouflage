# فقط پورت 80 — پورت 443 برای تانل/REALITY آزاد بماند
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html;
    index index.html;

    # ظاهر وب‌سرور معمولی
    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
    }

    # فایل‌های حساس را سرو نکن
    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/camouflage.access.log;
    error_log  /var/log/nginx/camouflage.error.log warn;
}
